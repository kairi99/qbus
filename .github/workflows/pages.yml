# Builds the game and publishes it on GitHub Pages on every push to master.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Publish the game

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The room server for online races (wss://qbus-rooms.<account>.workers.dev): a repository
          # variable (Settings → Secrets and variables → Actions → Variables). Unset: no online races.
          VITE_QBUS_ROOMS_URL: ${{ vars.QBUS_ROOMS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
